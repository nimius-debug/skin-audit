<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="How to take your three skin photos">
  <rect width="900" height="620" fill="#f1eada"/>
  <text x="450" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="400" fill="#2c3424">How to take your 3 photos</text>
  <text x="450" y="118" text-anchor="middle" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#4c583e">Bare skin. Natural light. No filter.</text>
  
  <g transform="translate(150 300)">
    <g transform="rotate(0)">
      <ellipse cx="0" cy="0" rx="72" ry="94" fill="#e4eade" stroke="#7a5f2a" stroke-width="3.5"/>
      <circle cx="-26" cy="-14" r="5" fill="#7a5f2a"/>
      <circle cx="26" cy="-14" r="5" fill="#7a5f2a"/>
      <path d="M-24 40q24 18 48 0" fill="none" stroke="#7a5f2a" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="146" text-anchor="middle" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8" fill="#2c3424">FRONT</text>
  </g>
  <g transform="translate(450 300)">
    <g transform="rotate(-22)">
      <ellipse cx="0" cy="0" rx="72" ry="94" fill="#e4eade" stroke="#7a5f2a" stroke-width="3.5"/>
      <circle cx="-26" cy="-14" r="5" fill="#7a5f2a"/>
      <circle cx="26" cy="-14" r="5" fill="#7a5f2a"/>
      <path d="M-24 40q24 18 48 0" fill="none" stroke="#7a5f2a" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="146" text-anchor="middle" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8" fill="#2c3424">LEFT SIDE</text>
  </g>
  <g transform="translate(750 300)">
    <g transform="rotate(22)">
      <ellipse cx="0" cy="0" rx="72" ry="94" fill="#e4eade" stroke="#7a5f2a" stroke-width="3.5"/>
      <circle cx="-26" cy="-14" r="5" fill="#7a5f2a"/>
      <circle cx="26" cy="-14" r="5" fill="#7a5f2a"/>
      <path d="M-24 40q24 18 48 0" fill="none" stroke="#7a5f2a" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="146" text-anchor="middle" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8" fill="#2c3424">RIGHT SIDE</text>
  </g>
  <g font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#4c583e">
    <text x="450" y="510" text-anchor="middle">Face a window — never overhead bathroom lights.</text>
    <text x="450" y="542" text-anchor="middle">No makeup, hair pulled back, phone at eye level.</text>
    <text x="450" y="574" text-anchor="middle">Don’t edit, brighten, or smooth them. I need the real thing.</text>
  </g>
</svg>
